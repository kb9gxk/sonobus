name: Build (Windows, macOS, Android)

# Personal multi-platform build for testing, on kb9gxk's own GitHub fork.
# Complements (doesn't replace) the existing GitLab CI, which only
# builds Windows on GL-Runner2 -- see .gitlab-ci.yml for that pipeline's
# own notes. This workflow uses GitHub-hosted runners exclusively, so
# none of GL-Runner2's LocalSystem-service quirks (broken VS Setup COM
# detection, missing C++ workload) apply here -- these runner images
# ship Visual Studio/Xcode/Android SDK fully preinstalled and run
# actions as a normal user account.
#
# Formats built, matching what upstream's own CMakeLists.txt already
# defaults to per-platform (see FormatsToBuild in CMakeLists.txt) minus
# AAX/VST2, which both need proprietary SDKs unavailable here (see
# .gitlab-ci.yml's own comment for why):
#   - Windows: Standalone + VST3
#   - macOS:   Standalone + VST3 + AU (AU needs no extra SDK, unlike
#              AAX/VST2, and CMakeLists.txt already adds it
#              automatically on APPLE)
#   - Android: Standalone app (.apk) only -- that's what
#              mobile/SonoBusMobile.jucer's Gradle project builds
#
# Signing:
#   - Windows: reuses the same self-signed cert as GitLab CI
#     (WIN_CODESIGN_PFX_B64 + WIN_CODESIGN_PASSWORD repo secrets, base64
#     for the same reason noted in .gitlab-ci.yml -- raw binary secret
#     values misbehave in some transports; base64 sidesteps it
#     uniformly rather than debugging per-platform). NOT a real trusted
#     certificate -- still triggers SmartScreen warnings.
#   - macOS: unsigned. Real notarization needs a paid Apple Developer
#     account we don't have, and ad-hoc self-signing wouldn't satisfy
#     Gatekeeper either, so there's no practical benefit to signing at
#     all here -- unlike Windows, there's no partial credit for a
#     self-signed cert. Users will need to right-click > Open the
#     first time (standard Gatekeeper bypass for unsigned apps).
#   - Android: standard Gradle debug build (assembleDebug), signed
#     with the auto-generated Android debug keystore. This is NOT the
#     same key as Sonosaurus's real Play Store release signing (that
#     needs sonoupload_keystore_password/sonoupload_key_password/
#     sonoupload_key, which we don't have and shouldn't try to obtain
#     -- those are Sonosaurus's own release credentials) -- a debug
#     build installs and runs fine for testing, it just can't replace
#     an existing release install of the real signed app on the same
#     device.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (SONOBUS_ENABLE_ASIO=OFF -- proprietary SDK unavailable here)
        # No explicit -G: hardcoding "Visual Studio 17 2022" failed here
        # with "could not find any instance of Visual Studio" -- this
        # runner image apparently ships a newer VS than that generator
        # name matches (same kind of version drift we hit on our own
        # GL-Runner2, just a different underlying cause there). Letting
        # cmake auto-detect the newest installed VS avoids hardcoding a
        # version that can drift out from under this workflow again.
        run: cmake -S . -B build -A x64 -DSONOBUS_ENABLE_ASIO=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign Standalone exe (self-signed, testing only)
        shell: pwsh
        env:
          WIN_CODESIGN_PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_B64 }}
          WIN_CODESIGN_PASSWORD: ${{ secrets.WIN_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("$PWD\sonobus-codesign.pfx", [Convert]::FromBase64String($env:WIN_CODESIGN_PFX_B64.Trim()))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction Stop | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          & $signtool sign /f "$PWD\sonobus-codesign.pfx" /p "$env:WIN_CODESIGN_PASSWORD" /fd SHA256 /t http://timestamp.digicert.com "build\SonoBus_artefacts\Release\Standalone\SonoBus.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item "$PWD\sonobus-codesign.pfx" -Force

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist\SonoBus\Plugins\VST3 | Out-Null
          Copy-Item build\SonoBus_artefacts\Release\Standalone\SonoBus.exe dist\SonoBus\
          Copy-Item -Recurse -Force build\SonoBus_artefacts\Release\VST3\SonoBus.vst3 dist\SonoBus\Plugins\VST3\
          Copy-Item -Recurse -Force build\SonoBusInst_artefacts\Release\VST3\SonoBusInstrument.vst3 dist\SonoBus\Plugins\VST3\
          Copy-Item doc\README_WINDOWS.txt dist\SonoBus\README.txt
          Compress-Archive -Path dist\SonoBus -DestinationPath sonobus-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: sonobus-windows-x86_64
          path: sonobus-windows-x86_64.zip
          retention-days: 30

  macos:
    # Pinned below -latest: this vendored JUCE version calls
    # CGWindowListCreateImage, which macOS 15's SDK marks fully
    # unavailable (not just deprecated) -- a real compile error, not a
    # warning. Rather than patch third-party vendored code, build
    # against an older SDK where the API still exists, matching the
    # same "don't touch vendored deps" approach used for the ASIO SDK
    # gap on Windows.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (unsigned)
        run: |
          set -e
          mkdir -p dist/SonoBus/Plugins/VST3 dist/SonoBus/Plugins/AU
          cp -R build/SonoBus_artefacts/Release/Standalone/SonoBus.app dist/SonoBus/
          cp -R build/SonoBus_artefacts/Release/VST3/SonoBus.vst3 dist/SonoBus/Plugins/VST3/
          cp -R build/SonoBusInst_artefacts/Release/VST3/SonoBusInstrument.vst3 dist/SonoBus/Plugins/VST3/
          cp -R build/SonoBus_artefacts/Release/AU/SonoBus.component dist/SonoBus/Plugins/AU/
          ditto -c -k --sequesterRsrc dist/SonoBus sonobus-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sonobus-macos
          path: sonobus-macos.zip
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # sdkmanager itself (the version bundled on this runner's
          # cmdline-tools) is compiled for JDK 17+ (class file version
          # 61.0) -- fails with UnsupportedClassVersionError under
          # JDK 11. Switched to JDK 11 further down, right before the
          # actual Gradle build, which needs the OPPOSITE (javac
          # crashes under 17) -- these are two different tools with
          # two different JDK requirements in the same job.
          java-version: "17"

      - name: Install the exact NDK/CMake versions this project pins
        run: |
          set -e
          # app/build.gradle sets ndkVersion twice -- 25.2.9519653 near
          # the top, then "22.0.7026061" again right before the closing
          # brace. Groovy DSL just runs both assignments in order, so
          # the later one silently wins; confirmed directly (Gradle's
          # own log shows it resolving/installing 22.0.7026061, not the
          # first value) rather than assumed from reading the file.
          # Installing both here so neither declaration can fail,
          # without touching this committed (and possibly
          # accidentally-duplicated) upstream file.
          # cmake version is separately pinned in the same file's
          # externalNativeBuild block ("3.22.1") -- AGP requires that
          # exact version resolvable via the SDK's own cmake package,
          # not just any cmake found on PATH.
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "ndk;22.0.7026061" "cmake;3.22.1"

      - name: Point local.properties at this runner's SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > mobile/Builds/Android/local.properties

      - name: Generate placeholder mipmap launcher icons
        run: |
          set -e
          # AndroidManifest.xml references @mipmap/ic_launcher and
          # @mipmap/ic_launcher_round, but the committed resources only
          # have drawable-*/icon.png (older JUCE export convention) --
          # no mipmap-* directories exist at all. This looks like a
          # Projucer-regenerated resource that never got committed.
          # Rather than touch the committed Android project, generate
          # placeholder mipmap icons from the existing drawable icon
          # for CI purposes only -- fine for a personal test build,
          # not meant to produce the real app icon.
          RES=mobile/Builds/Android/app/src/main/res
          for density in ldpi mdpi hdpi xhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "$RES/drawable-$density/icon.png" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/drawable-$density/icon.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Switching to JDK 11 here, for the actual Gradle/javac
          # build -- see the earlier setup-java step's comment for why
          # this job needs two different JDK versions.
          java-version: "11"

      - name: Generate a throwaway signing keystore (testing only)
        run: |
          set -e
          # Both debug and release buildTypes in build.gradle
          # explicitly set signingConfig signingConfigs.juceSigning --
          # there's no fallback to Android's normal auto-generated
          # debug keystore. That signing config points at
          # ~/.android/sonouploadnew.jks (Sonosaurus's real Play Store
          # release keystore, which we don't have and shouldn't try to
          # obtain) and reads its store/key passwords + alias from
          # Gradle properties. Confirmed the actual compile succeeds
          # fine without it -- only the final validateSigningDebug_Debug
          # step fails ("Keystore file ... not found"). Generating a
          # throwaway keystore at the exact expected path, with
          # credentials matching what's passed via -P below, is the
          # same spirit as the Windows self-signed cert: proves the
          # build produces a real, installable APK for testing, not a
          # real release signature.
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/sonouploadnew.jks -storetype jks \
            -alias sonobus-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cidebugonly -keypass cidebugonly \
            -dname "CN=SonoBus CI, OU=Testing, O=kb9gxk, C=US"

      - name: Build debug APK
        working-directory: mobile/Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Psonoupload_keystore_password=cidebugonly -Psonoupload_key_password=cidebugonly -Psonoupload_key=sonobus-ci

      - uses: actions/upload-artifact@v4
        with:
          name: sonobus-android-debug
          path: mobile/Builds/Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
